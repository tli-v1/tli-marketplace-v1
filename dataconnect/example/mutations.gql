mutation CreateLawyerClientAgreement(
  $caseId: UUID!
  $message: String
  $fileName: String!
  $storagePath: String!
  $publicUrl: String
  $contentType: String
  $fileSize: Int
) @auth(expr: "auth.token.role == 'lawyer'") @transaction {
  query @redact {
    case(key: { id: $caseId }) @check(expr: "this != null", message: "Case not found") {
      id
    }
  }
  lawyerClientAgreement_insert(
    data: {
      caseId: $caseId
      lawyerId_expr: "auth.uid"
      message: $message
      createdAt_expr: "request.time"
      updatedAt_expr: "request.time"
    }
  )
  lawyerClientAgreementFile_insert(
    data: {
      agreementId_expr: "response.lawyerClientAgreement_insert.id"
      fileName: $fileName
      storagePath: $storagePath
      publicUrl: $publicUrl
      contentType: $contentType
      fileSize: $fileSize
      createdAt_expr: "request.time"
    }
  )
}

mutation CreateLawFirmApplication(
  $lawFirmName: String!
  $primaryContactName: String!
  $email: String!
  $phone: String!
  $website: String
  $numberOfAttorneys: Int!
  $monthlyCaseCapacity: Int!
  $googleBusinessProfileUrl: String!
  $googleRating: Float!
  $approximateClientsServed: Int
  $clientServiceYears: Float
  $marketplaceFit: String!
  $attorneysGoodStanding: GoodStandingAnswer!
  $goodStandingExplanation: String
) @auth(level: PUBLIC, insecureReason: "Law firms submit applications before marketplace account approval") {
  lawFirmApplication_insert(
    data: {
      lawFirmName: $lawFirmName
      primaryContactName: $primaryContactName
      email: $email
      phone: $phone
      website: $website
      numberOfAttorneys: $numberOfAttorneys
      monthlyCaseCapacity: $monthlyCaseCapacity
      googleBusinessProfileUrl: $googleBusinessProfileUrl
      googleRating: $googleRating
      approximateClientsServed: $approximateClientsServed
      clientServiceYears: $clientServiceYears
      marketplaceFit: $marketplaceFit
      attorneysGoodStanding: $attorneysGoodStanding
      goodStandingExplanation: $goodStandingExplanation
      status: NEW
      createdAt_expr: "request.time"
      updatedAt_expr: "request.time"
    }
  )
}

