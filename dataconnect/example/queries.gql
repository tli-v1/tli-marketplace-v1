query GetMyAgreements @auth(expr: "auth.token.role == 'lawyer'") {
  lawyerClientAgreements(
    where: { lawyerId: { eq_expr: "auth.uid" } }
    orderBy: [{ createdAt: DESC }]
  ) {
    id
    caseId
    lawyerId
    message
    createdAt
    updatedAt
    myAgreementFiles: lawyerClientAgreementFiles_on_agreement(orderBy: [{ createdAt: ASC }]) {
      id
      agreementId
      fileName
      storagePath
      publicUrl
      contentType
      fileSize
      createdAt
    }
  }
}
